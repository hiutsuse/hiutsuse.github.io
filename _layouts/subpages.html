<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ '/assets/css/vertical.css' | relative_url }}">
  <style>
    main {
      display: block;
      padding: 1rem 2rem;
    }

    .container {
      margin-top: 0;
      box-shadow: none;
    }
  </style>
  <title>
    {{ page.title }}　|　{{ site.title }}
  </title>
  <!-- Thanks to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+JP:wght@500;900&family=Noto+Serif+JP:wght@600;900&display=swap">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+JP:wght@500;900&family=Noto+Serif+JP:wght@600;900&display=swap"
    media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/vs2015.css"
    media="print" onload="this.media='all'">
</head>

<body>
  <!-- header -->
  {% include header.html %}
  <main>
    <div class="container">
      <header>
        <h1>{{ page.title }}</h1>
        <div class="meta-info">
          <p>最終更新日</p>
          <time datetime='{{ page.update_date | date: "%Y-%m-%d" }}'>{{ page.update_date | date: "%Y年%m月%d日" }}</time>
        </div>
      </header>
      <article>
        {{ content }}
      </article>
    </div>
    <div class="to-top full-bleed"><a href="#top"><i class="bi bi-arrow-bar-up"></i></a></div>
  </main>
  <!-- footer -->
  {% include footer.html %}

  <!-- 非表示で埋め込む -->
  <svg style="display:none">
    <filter id="figureBackFilter">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feBlend in="SourceGraphic" in2="blur" mode="screen" />
    </filter>
  </svg>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

  <!-- and it's easy to individually load additional languages -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/go.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dedent@1.0.1/dist/dedent.umd.js"></script>
  <script src="{{ '/assets/scripts/main.js' | relative_url }}"></script>
</body>

</html>
